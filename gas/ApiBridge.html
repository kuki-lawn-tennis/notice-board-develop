<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<script>
  const allowedOrigins = <?!= JSON.stringify(allowedOrigins) ?>;
  const parentOrigin = <?!= JSON.stringify(parentOrigin) ?>;
  const channelNonce = <?!= JSON.stringify(channelNonce) ?>;
  const allowedMethods = new Set([
    'checkAdminPassword',
    'deleteCourtDutyFile',
    'deleteItem',
    'getAdminData',
    'getCourtDutyFileData',
    'getPublicData',
    'getTopImageDataUrl',
    'listCourtDutyFiles',
    'logoutAdmin',
    'saveDisplayOrder',
    'saveItem',
    'saveItemWithAttachments',
    'savePageAccessLog',
    'saveSettings',
    'saveTopAccessSummary',
    'uploadCourtDutyFile'
  ]);

  function postToParent_(message) {
    window.top.postMessage(message, parentOrigin || '*');
  }

  function respond_(request, success, result) {
    postToParent_({
      type: 'gas-api-response',
      nonce: channelNonce,
      id: request.id,
      success: success,
      result: success ? result : undefined,
      error: success ? undefined : String(result && result.message || result || 'GAS APIの処理に失敗しました。')
    });
  }

  if (!allowedOrigins.includes(parentOrigin)) {
    postToParent_({
      type: 'gas-api-error',
      nonce: channelNonce,
      error: allowedOrigins.length
        ? 'このサイトのオリジンはGITHUB_PAGES_ORIGINSに許可されていません。'
        : 'GASのスクリプトプロパティGITHUB_PAGES_ORIGINSを設定してください。'
    });
  } else {
    window.addEventListener('message', function(event) {
      if (event.source !== window.top || event.origin !== parentOrigin || !event.data) return;

      const message = event.data;
      if (message.nonce !== channelNonce || message.type !== 'gas-api-request') return;

      if (typeof message.id !== 'string' || !message.id) return;
      if (typeof message.method !== 'string' || !allowedMethods.has(message.method)) {
        respond_(message, false, '未許可のAPIメソッドです: ' + String(message.method || '未指定'));
        return;
      }
      if (!Array.isArray(message.args)) {
        respond_(message, false, 'API引数の形式が正しくありません。');
        return;
      }

      const runner = google.script.run
        .withSuccessHandler(function(result) {
          respond_(message, true, result);
        })
        .withFailureHandler(function(error) {
          respond_(message, false, error);
        });

      try {
        runner[message.method].apply(runner, message.args);
      } catch (error) {
        respond_(message, false, error);
      }
    });

    postToParent_({ type: 'gas-api-ready', nonce: channelNonce });
  }
</script>
</body>
</html>
