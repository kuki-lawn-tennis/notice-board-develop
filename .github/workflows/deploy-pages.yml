name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - style.css
      - manifest.json
      - images/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # 手動実行でも main ブランチ以外ではデプロイしない
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Inject GAS web app URL
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          url = os.environ.get("GAS_WEB_APP_URL", "")
          if not re.fullmatch(r"https://script\.google\.com/macros/s/[^/]+/exec", url):
              raise SystemExit("Set the Actions variable GAS_WEB_APP_URL to a valid GAS /exec URL.")

          index = pathlib.Path("index.html")
          html = index.read_text(encoding="utf-8")
          placeholder = "'__GAS_WEB_APP_URL__'"
          if html.count(placeholder) != 1:
              raise SystemExit("Expected exactly one GAS_WEB_APP_URL placeholder in index.html.")

          index.write_text(html.replace(placeholder, json.dumps(url)), encoding="utf-8")
          PY

      - name: Add cache-busting version to style.css link
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          index = pathlib.Path("index.html")
          html = index.read_text(encoding="utf-8")
          link = 'href="style.css"'
          if html.count(link) != 1:
              raise SystemExit("Expected exactly one style.css link in index.html.")

          version = os.environ["ASSET_VERSION"][:12]
          index.write_text(html.replace(link, f'href="style.css?v={version}"'), encoding="utf-8")
          PY

      - name: Add cache-busting version to top image
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          index = pathlib.Path("index.html")
          html = index.read_text(encoding="utf-8")
          src = 'src="images/TopPageImage.jpeg"'
          if html.count(src) != 1:
              raise SystemExit("Expected exactly one images/TopPageImage.jpeg reference in index.html.")

          version = os.environ["ASSET_VERSION"][:12]
          index.write_text(html.replace(src, f'src="images/TopPageImage.jpeg?v={version}"'), encoding="utf-8")
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp style.css _site/style.css
          cp manifest.json _site/manifest.json
          cp -r images _site/images

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
