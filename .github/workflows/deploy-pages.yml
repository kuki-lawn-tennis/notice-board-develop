name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Inject GAS web app URL
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          url = os.environ.get("GAS_WEB_APP_URL", "")
          if not re.fullmatch(r"https://script\.google\.com/macros/s/[^/]+/exec", url):
              raise SystemExit("Set the Actions variable GAS_WEB_APP_URL to a valid GAS /exec URL.")

          index = pathlib.Path("index.html")
          html = index.read_text(encoding="utf-8")
          placeholder = "'__GAS_WEB_APP_URL__'"
          if html.count(placeholder) != 1:
              raise SystemExit("Expected exactly one GAS_WEB_APP_URL placeholder in index.html.")

          index.write_text(html.replace(placeholder, json.dumps(url)), encoding="utf-8")
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
